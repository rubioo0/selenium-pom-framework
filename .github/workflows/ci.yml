name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SeleniumPomFramework.csproj

      - name: Build
        run: dotnet build src/SeleniumPomFramework.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test src/SeleniumPomFramework.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: '**/screenshots/**'
          if-no-files-found: ignore
